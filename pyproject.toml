[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studio-core"
version = "0.1.0"
description = "공통 비즈니스 로직 라이브러리 - 인증, 유틸리티, Supabase 연동"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Studio Team"},
]
keywords = ["auth", "supabase", "utilities", "core"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
streamlit = [
    "streamlit>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/your-org/studio-core"
Repository = "https://github.com/your-org/studio-core"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studio_core"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
